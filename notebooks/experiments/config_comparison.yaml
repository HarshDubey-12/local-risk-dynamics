# Bandwidths are on the scale of decimal factor returns (std ~0.02-0.04,
# median query-to-train distance ~0.07). bandwidth >= ~1.0 makes every kernel
# weight ~1, which collapses LWLR/MCLLR to their global counterparts.
dataset_path: data/raw/F-F_Research_Data_5_Factors_2x3.csv
train_ratio: 0.8
models:
  - model_type: global_linear
    fit_intercept: true
  - model_type: lwlr
    fit_intercept: true
    bandwidth: 0.08
  - model_type: mc_linear
    fit_intercept: true
    n_simulations: 50
    subsample_size: 100
    random_state: 42
  - model_type: mcllr
    fit_intercept: true
    bandwidth: 0.08
    n_simulations: 50
    subsample_size: 100
    random_state: 42
