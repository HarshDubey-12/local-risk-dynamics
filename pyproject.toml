[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "local-risk-dynamics"
version = "0.2.0"
description = "Deterministic vs stochastic locality in linear models for financial risk"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["lrd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
